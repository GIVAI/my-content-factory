  title: "Личная стратегия счастливых отношений"
  subtitle: "5 шагов к отношениям, в которых счастлива именно ты"
  author: "Диана Градова"
  role: "Психолог · Автор тренинга FIRE"
  brand: "Диана Градова"
  file_name: "lichnaya-strategiya-schastlivyh-otnosheniy"
  keywords: "отношения, психология, рабочая тетрадь, Диана Градова"

pages:
  # ═══════════════════════════════════════════════════ обложка
  - type: cover
    eyebrow: "Рабочая тетрадь"
    note: "5 шагов"
    title: "Личная стратегия счастливых отношений"
    title_size: "36pt"
    photo:
      src: "assets/photos/01-jacket.jpg"
      tint: 0.90
      position: "center 16%"
    subtitle: "5 шагов, которые помогут понять, какой мужчина подходит тебе, какие отношения ты хочешь строить, что для тебя является нормой, что неприемлемо и как ты хочешь чувствовать себя рядом с мужчиной"
    for_whom: "Это не чтение, а работа с собой. Все поля заполняются прямо в файле — с компьютера, планшета или телефона. Можно и распечатать, чтобы писать от руки."
    seal: "Рабочая\nтетрадь"

  # ═══════════════════════════════════════════════════ знакомство
  - type: content
    kicker: "Знакомство"
    fill: true
    title: "Привет, я Диана Градова"
    blocks:
      - type: cols
        ratio: [2, 3]
        columns:
          - - type: image
              src: "assets/photos/04-laugh-bw.jpg"
              height: 56
              position: "center 20%"
          - - type: lead
              text: "Я могла бы начать этот файл с регалий и рассказать, сколько лет я в психологии, но в теме отношений для меня гораздо важнее другое: **я не просто знаю, как устроены отношения в теории. Я каждый день живу внутри тех отношений, которые сама когда-то мечтала построить.**"
      - type: text
        text: "Я жена. Мама. Девушка со своими большими желаниями, реализацией, деньгами, амбициями и насыщенной жизнью."
      - type: heading
        text: "Как построить отношения, в которых ты можешь быть собой и тебе в них офигенно?"
      - type: list
        items:
          - "Где есть любовь, но ты не растворяешься в мужчине."
          - "Где есть близость, но остаётся сексуальное притяжение."
          - "Где мужчина растёт, но тебе не приходится становиться его мамой или мотиватором."
          - "Где можно хотеть красивой жизни, больших денег и спокойно говорить об этом."
          - "Где спустя годы вы не просто «сохранили семью», а всё ещё **выбираете друг друга**."
      - type: text
        text: "За годы личного опыта и работы с девушками я увидела одну вещь: **мы чаще строим отношения по бессознательному сценарию, чем по собственному выбору.**"
      - type: text
        text: "Поэтому я создала этот файл не чтобы дать тебе очередные «10 правил идеальной девушки». А чтобы за 5 шагов ты смогла увидеть ==свою механику любви== и в конце собрать свои идеальные отношения."
      - type: callout
        title: "Как работать с тетрадью"
        text: "Отвечай первым, что приходит в голову — первая мысль обычно самая честная. Поля заполняются прямо в файле: открой его в Acrobat Reader, «Просмотре» на Mac или в браузере. Можно и распечатать, тогда пиши от руки."
      - type: lead
        text: "Начинаем."

  # ═══════════════════════════════════════════════════ ШАГ 1
  - type: divider
    number: "01"
    photo:
      src: "assets/photos/03-curb-bw.jpg"
      tint: 0.88
      blur: 4
      position: "center 26%"
    title: "5 сценариев любви"
    caption: "Какой сценарий управляет твоими отношениями и выбором партнёра"

  - type: content
    kicker: "Шаг 01 · Сценарии любви"
    title: "Мужчина новый, а отношения как будто старые"
    blocks:
      - type: text
        text: "Другой человек, другая история, всё начинается совершенно иначе, а потом ты снова ловишь себя на знакомом чувстве: заслуживаешь внимание, всё решаешь сама, спасаешь или влюбляешься в того, с кем спокойно просто не бывает."
      - type: lead
        text: "**Меняются мужчины. Но сценарий, по которому ты строишь любовь, может оставаться тем же.**"
      - type: text
        text: "Давай посмотрим, какой из этих пяти твой."
      - type: card
        number: "01"
        title: "«Я заслужу любовь»"
        text:
          - "Ты стараешься быть идеальной, удобной, понимающей, сексуальной: такой, которую невозможно не выбрать."
          - "А когда мужчина отдаляется, вместо **«подходит ли мне это?»** появляется мысль: **«что ещё мне сделать, чтобы он меня выбрал?»**"
      - type: card
        number: "02"
        title: "«Я его спасу»"
        text:
          - "Ты влюбляешься не только в мужчину, но и в его потенциал."
          - "Сейчас у него сложный период, сейчас не получается с деньгами, сейчас он не готов, **но ты видишь, каким он может стать.**"
          - "И иногда строишь отношения с его будущей версией вместо той, которая находится рядом сегодня."
      - type: card
        number: "03"
        title: "«Я сама»"
        text:
          - "Ты привыкла сама всё решать, организовывать, зарабатывать и брать ответственность."
          - "Эта сила приходит и в отношения: **сама решила, сама сделала, сама проконтролировала.** А потом возникает вопрос: «Почему рядом со мной мужчина перестал проявляться?»"

  - type: content
    kicker: "Шаг 01 · Сценарии любви"
    fill: true
    blocks:
      - type: card
        number: "04"
        title: "«Любовь должна быть яркой»"
        text:
          - "Когда всё спокойно и предсказуемо — становится скучно."
          - "А эмоциональные качели, неопределённость и сильная химия легко считываются как «вот это настоящая любовь»."
          - "**Иногда мы путаем глубину чувств с интенсивностью эмоций.**"
      - type: card
        number: "05"
        title: "«Главное — не потерять себя»"
        text:
          - "Тебе хорошо в отношениях, пока мужчина не становится слишком важным."
          - "Тогда хочется отдалиться, вернуть контроль, меньше показывать свои чувства и снова почувствовать: «я ни от кого не завишу»."
          - "Потому что настоящая близость означает не только любовь, но и уязвимость."
      - type: checklist
        label: "Отметь сценарии, которые узнаёшь в себе"
        items:
          - "«Я заслужу любовь»"
          - "«Я его спасу»"
          - "«Я сама»"
          - "«Любовь должна быть яркой»"
          - "«Главное — не потерять себя»"
      - type: quote
        text: "Пока ты не замечаешь свой сценарий — он выбирает за тебя. Когда замечаешь — появляется возможность выбрать самой."

  - type: content
    kicker: "Шаг 01 · Задание"
    title: "Задание"
    blocks:
      - type: text
        text: "Посмотри на свои последние 2–3 значимые истории и ответь честно."
      - type: field
        q: "01"
        label: "Повторяющееся"
        ask: "Что повторялось минимум в двух моих отношениях?"
        lines: 5
      - type: field
        q: "02"
        label: "Притяжение"
        ask: "Какие мужчины вызывают у меня самое сильное притяжение? Что у них общего?"
        lines: 5
      - type: field
        q: "03"
        label: "Страх потери"
        ask: "Что я обычно начинаю делать, когда боюсь потерять мужчину?"
        lines: 5

  - type: content
    kicker: "Шаг 01 · Задание"
    blocks:
      - type: field
        q: "04"
        label: "Узнавание"
        ask: "Какой из пяти сценариев я узнаю в себе сильнее всего?"
        lines: 4
      - type: box
        label: "Мой главный сценарий"
        ask: "Опиши его своими словами — как он звучит именно у тебя."
        grow: true
      - type: callout
        text: "Сценарий — это не приговор и не диагноз. Это привычка, которую ты наконец увидела. С этого места и начинается выбор."

  # ═══════════════════════════════════════════════════ ШАГ 2
  - type: divider
    number: "02"
    photo:
      src: "assets/photos/06-gifts.jpg"
      tint: 0.88
      blur: 4
      crop: [0.0, 0.42, 1.0, 1.0]
      position: "center 50%"
    title: "Женщина, в которую хочется вкладываться"
    caption: "5 правил. И речь сейчас не только про деньги"

  - type: content
    kicker: "Шаг 02 · Вклад"
    title: "Что значит «вкладываться»"
    blocks:
      - type: lead
        text: "Вкладываться — это хотеть делать для женщины больше: заботиться, радовать, помогать, проявлять инициативу, уделять время, внимание и, да, тратить на неё деньги."
      - type: text
        text: "Здесь нет волшебной кнопки «сделай эти 5 вещей — и любой мужчина положит к твоим ногам мир». Но есть женщины, рядом с которыми мужчине самому хочется проявляться больше. И вот что у них общего."
      - type: card
        number: "01"
        title: "Она умеет хотеть"
        text:
          - "Она знает, что ей нравится, чего ей хочется — и не стесняется своих желаний."
      - type: card
        number: "02"
        title: "Она умеет принимать"
        text:
          - "Подарок — без «ой, зачем ты столько потратил». Помощь — без «нет-нет, я сама». Комплимент — без «да ладно, я сегодня ужасно выгляжу»."
          - "**Можно очень хотеть, чтобы мужчина давал больше, и одновременно самой не уметь это получать.**"
      - type: card
        number: "03"
        title: "Она не делает за мужчину то, что хочет получать от него"
        text:
          - "Хочешь инициативы — оставь место для инициативы. Хочешь, чтобы он решал вопросы — не решай их за него заранее."
          - "Иногда мы сначала сами всё сделали, а потом обиделись, что мужчина ничего не делает."

  - type: content
    kicker: "Шаг 02 · Вклад"
    fill: true
    blocks:
      - type: card
        number: "04"
        title: "Она поддерживает, но не спасает"
        text:
          - "Поддержать мужчину, когда ему сложно, — одно. Взять на себя его проблемы, ответственность и последствия его решений — совсем другое."
          - "**Можно верить в мужчину и при этом не проживать его жизнь вместо него.**"
      - type: card
        number: "05"
        title: "Она умеет показывать: «мне с тобой хорошо»"
        text:
          - "Не воспринимает всё хорошее как должное. Замечает его поступки. Благодарит. Радуется."
          - "Нам всем хочется делать больше там, где наши действия имеют значение."
      - type: options
        label: "Пройдись по пяти правилам"
        items:
          - text: "Она умеет хотеть"
            choices: ["Уже про меня", "Даётся сложно"]
          - text: "Она умеет принимать"
            choices: ["Уже про меня", "Даётся сложно"]
          - text: "Она не делает за мужчину то, что хочет получать от него"
            choices: ["Уже про меня", "Даётся сложно"]
          - text: "Она поддерживает, но не спасает"
            choices: ["Уже про меня", "Даётся сложно"]
          - text: "Она умеет показывать: «мне с тобой хорошо»"
            choices: ["Уже про меня", "Даётся сложно"]
      - type: quote
        text: "Мужчина вкладывается не туда, где его просят. А туда, где это заметят."

  - type: content
    kicker: "Шаг 02 · Задание"
    fill: true
    title: "Баланс вклада"
    blocks:
      - type: text
        text: "В отношениях важно не только понимать, что ты хочешь получать от мужчины, но и **какой сама хочешь быть рядом с ним.** Отметь в каждой колонке то, что важно именно тебе."
      - type: cols
        columns:
          - - type: checklist
              label: "Я хочу получать"
              items:
                - "время"
                - "заботу"
                - "внимание"
                - "деньги / подарки"
                - "инициативу"
                - "поддержку"
                - "помощь"
                - "секс"
                - "эмоциональную близость"
                - "свободу"
                - "вдохновение"
          - - type: checklist
              label: "Я хочу давать"
              items:
                - "время"
                - "заботу"
                - "внимание"
                - "деньги / подарки"
                - "инициативу"
                - "поддержку"
                - "помощь"
                - "секс"
                - "эмоциональную близость"
                - "свободу"
                - "вдохновение"
      - type: note
        text: "Сравни колонки. Совпадения — это про баланс. Расхождения — самое интересное место для разговора с собой."

  - type: content
    kicker: "Шаг 02 · Задание"
    fill: true
    title: "А теперь самое интересное"
    blocks:
      - type: field
        q: "01"
        label: "Чтобы чувствовать себя любимой"
        ask: "Что мне особенно важно получать от мужчины, чтобы я чувствовала себя любимой и счастливой в отношениях?"
        lines: 5
      - type: field
        q: "02"
        label: "Даю вместо того, чтобы получать"
        ask: "Что я постоянно даю сама, хотя на самом деле хочу получать это от мужчины?"
        lines: 5
      - type: field
        q: "03"
        label: "Жду, но не приношу"
        ask: "А где я, наоборот, привыкла ждать от мужчины того, что сама почти не привношу в отношения?"
        lines: 5
      - type: callout
        text: "Посмотри на свои ответы. Именно такой обмен между мужчиной и женщиной ты хочешь создать — не «кто кому должен», а **как вам обоим хочется любить друг друга.**"

  # ═══════════════════════════════════════════════════ ШАГ 3
  - type: divider
    number: "03"
    photo:
      src: "assets/photos/08-yacht.jpg"
      tint: 0.88
      blur: 4
      position: "center 38%"
    title: "Деньги в отношениях"
    caption: "5 женских стратегий, которые незаметно меняют финансовую динамику пары"

  - type: content
    kicker: "Шаг 03 · Деньги"
    title: "Почему всё начинается именно здесь"
    blocks:
      - type: text
        text: "Можно сколько угодно говорить, что «деньги — это просто деньги», но именно из-за них в отношениях часто начинается самое интересное."
      - type: list
        items:
          - "Кому платить за ужин?"
          - "Можно ли просить дорогие подарки?"
          - "Должен ли мужчина обеспечивать семью?"
          - "Нормально ли зарабатывать больше мужа?"
          - "Помогать ли ему, если у него проблемы?"
      - type: lead
        text: "То, как мы ведём себя с деньгами в паре, очень многое говорит не о количестве денег, а о том, **что мы привыкли считать любовью, заботой, безопасностью и своей ценностью.**"
      - type: text
        text: "Посмотри, какая из этих стратегий тебе знакома."
      - type: card
        number: "01"
        title: "«Я сама»"
        text:
          - "Ты привыкла сама зарабатывать, покупать себе всё, что хочешь, и ни от кого не зависеть."
          - "И это прекрасно. Пока за «я сама» не скрывается **«мне сложно позволить мужчине что-то для меня делать»**."
      - type: card
        number: "02"
        title: "«Он должен сам догадаться»"
        text:
          - "Тебе хочется цветов, подарков, путешествий, определённого уровня жизни. Но говорить об этом неловко: «если любит — сам поймёт»."
          - "Спойлер: не поймёт."

  - type: content
    kicker: "Шаг 03 · Деньги"
    fill: true
    blocks:
      - type: card
        number: "03"
        title: "«Я помогу ему стать успешным»"
        text:
          - "Ты поддерживаешь, мотивируешь, помогаешь деньгами, берёшь часть проблем на себя."
          - "И здесь главный вопрос: **если убрать твою помощь — он сам двигает свою жизнь вперёд?**"
      - type: card
        number: "04"
        title: "«Мне много не надо»"
        text:
          - "Хочется одного — просишь попроще. Хочется лучшего уровня жизни — молчишь. Потому что страшно показаться меркантильной или требовательной."
          - "Одно дело — действительно хотеть немного. Другое — **уменьшать свои желания, чтобы тебя было легче любить.**"
      - type: card
        number: "05"
        title: "«Любовь нужно доказывать деньгами»"
        text:
          - "Чем больше мужчина тратит, тем сильнее любит. И незаметно отношения превращаются в постоянную проверку: «а насколько я для тебя ценна?»"
          - "Хотеть щедрого мужчину — нормально. Хотеть дорогих подарков — тоже. **Подарок может быть проявлением любви, но не должен становиться единственным её доказательством.**"
      - type: checklist
        label: "Какая стратегия тебе знакома"
        items:
          - "«Я сама»"
          - "«Он должен сам догадаться»"
          - "«Я помогу ему стать успешным»"
          - "«Мне много не надо»"
          - "«Любовь нужно доказывать деньгами»"

  - type: content
    kicker: "Шаг 03 · Задание"
    title: "Моя финансовая модель"
    blocks:
      - type: field
        label: "Мне комфортно, когда мужчина финансово…"
        lines: 4
      - type: field
        label: "Мне некомфортно, когда…"
        lines: 4
      - type: field
        label: "Мне легко принимать от мужчины…"
        lines: 3
      - type: field
        label: "Мне сложно принимать…"
        lines: 3
      - type: field
        label: "Я никогда больше не хочу отношений, где деньги…"
        lines: 4

  - type: content
    kicker: "Шаг 03 · Задание"
    blocks:
      - type: box
        label: "Идеальная финансовая модель моих отношений"
        ask: "Опиши её так, как будто рассказываешь подруге: кто что берёт на себя, как вы принимаете решения, что для тебя точно важно."
        height: 95
      - type: callout
        text: "Не существует одной правильной финансовой модели пары. Важно понять, **в какой хорошо именно тебе.**"

  # ═══════════════════════════════════════════════════ ШАГ 4
  - type: divider
    number: "04"
    photo:
      src: "assets/photos/02-sidewalk.jpg"
