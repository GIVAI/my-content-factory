# ===========================================================================
#  Содержание рабочей тетради.
#  Это ДЕМО-наполнение — оно нужно, чтобы показать дизайн и все типы блоков.
#  Замените тексты своими: структура и стиль сохранятся автоматически.
#
#  Типы блоков: text · lead · note · heading · list · numbered · quote ·
#               callout · panel · spacer · field · box · checklist · grid ·
#               scale · duo · cols
#  Разметка внутри текста: **жирный**, *курсив*, ==выделение цветом==
# ===========================================================================

meta:
  title: "Точка А"
  subtitle: "Честный разговор с собой на восемь страниц"
  author: "Имя Фамилия"
  role: "Коуч · Автор программы «Ясность»"
  brand: "Ясность"
  file_name: "tochka-a-workbook"
  keywords: "рабочая тетрадь, лид-магнит, коучинг"

pages:
  # ---------------------------------------------------------------- обложка
  - type: cover
    eyebrow: "Рабочая тетрадь"
    title: "Точка А"
    subtitle: "Восемь страниц, после которых вы точно знаете, где находитесь и что делать дальше."
    for_whom: "Для тех, кто много делает — и всё равно не чувствует движения. Внутри — вопросы, на которые почти никогда не находится времени. Отвечайте прямо в файле или распечатайте и пишите от руки."
    note: "8 страниц · 40 минут"
    seal: "Рабочая\nтетрадь"

  # ---------------------------------------------------------------- как работать
  - type: content
    kicker: "Перед стартом"
    kicker_right: "5 минут"
    title: "Как работать с тетрадью"
    blocks:
      - type: lead
        text: "Эта тетрадь не про правильные ответы. Она про честные. Единственный человек, который увидит эти страницы, — вы."
      - type: numbered
        items:
          - "Выделите 40 минут и место, где вас не тронут."
          - "Отвечайте первым, что приходит в голову: первая мысль обычно самая точная."
          - "Не пропускайте неудобные вопросы — именно они дают результат."
          - "Вернитесь к тетради через месяц и перечитайте. Разница вас удивит."
      - type: callout
        title: "Важно"
        text: "Поля в этом PDF заполняются прямо на компьютере или планшете. Откройте файл в Adobe Acrobat Reader, «Просмотре» на Mac или в браузере — и просто печатайте в строчках."
      - type: checklist
        label: "Отметьте, что уже сделали"
        items:
          - "Отложил телефон и закрыл вкладки"
          - "Налил себе что-нибудь тёплое"
          - "Разрешил себе писать неидеально"
      - type: field
        label: "Дата начала"
        lines: 1

  # ---------------------------------------------------------------- раздел 1
  - type: divider
    number: "01"
    title: "Где я сейчас"
    caption: "Сначала — точка А. Без неё любая карта бесполезна: невозможно проложить маршрут, не зная, откуда выходишь."

  - type: content
    kicker: "Раздел 01 · Где я сейчас"
    title: "Честный срез"
    blocks:
      - type: field
        q: "01"
        label: "Первый вопрос"
        ask: "Опишите вашу текущую ситуацию так, как рассказали бы близкому другу — без формулировок для резюме."
        lines: 5
      - type: field
        q: "02"
        label: "Что забирает силы"
        ask: "Назовите три вещи, после которых вы чувствуете себя пустым."
        hint: "Это могут быть люди, задачи, привычки или мысли."
        lines: 3
      - type: quote
        text: "Мы редко застреваем из-за нехватки сил. Чаще — из-за того, что тратим их не туда."
        author: "Из программы «Ясность»"

  - type: content
    kicker: "Раздел 01 · Где я сейчас"
    title: "Шкала честности"
    blocks:
      - type: scale
        label: "Насколько вы довольны тем, как проходит ваш обычный день?"
        min: 1
        max: 10
        min_label: "1 — совсем не доволен"
        max_label: "10 — всё как хочу"
      - type: box
        label: "Почему именно эта цифра"
        ask: "Что должно измениться, чтобы стало на два балла больше?"
        height: 40
      - type: note
        text: "Подсказка: два балла — это не революция. Это одно решение, которое вы давно откладываете."

  # ---------------------------------------------------------------- раздел 2
  - type: divider
    number: "02"
    title: "Куда я иду"
    caption: "Теперь — точка Б. Не «идеальная жизнь из инстаграма», а версия, в которую вы действительно верите."

  - type: content
    kicker: "Раздел 02 · Куда я иду"
    title: "Через год"
    blocks:
      - type: duo
        label: "Два кадра"
        sides:
          - label: "Если ничего не менять"
            lines: 6
          - label: "Если начать сегодня"
            lines: 6
      - type: field
        label: "Одна фраза"
        ask: "Опишите желаемый результат одним предложением, как заголовок."
        lines: 2

  - type: content
    kicker: "Раздел 02 · Куда я иду"
    title: "План на 30 дней"
    blocks:
      - type: text
        text: "Большие цели не двигаются с места. Двигаются **следующие маленькие шаги**. Заполните таблицу: четыре шага, четыре срока, четыре признака, что шаг сделан."
      - type: grid
        label: "Ближайшие шаги"
        columns: ["Шаг", "Когда", "Как пойму, что сделал"]
        rows: 4
        row_height: 13
      - type: callout
        title: "Правило одного шага"
        text: "Если шаг занимает больше двух часов — это не шаг, а проект. Разбейте его."

  # ---------------------------------------------------------------- финал
  - type: content
    kicker: "Итог"
    title: "Что дальше"
    blocks:
      - type: lead
        text: "Вы прошли тетрадь. Осталось закрепить — иначе через неделю всё растворится в делах."
      - type: checklist
        label: "Финальный чек-лист"
        items:
          - "Поставил напоминание на первый шаг"
          - "Рассказал о плане одному человеку"
          - "Записал дату, когда перечитаю тетрадь"
      - type: field
        label: "Вернуться к тетради"
        ask: "Какого числа вы перечитаете эти страницы?"
        lines: 1
      - type: box
        label: "Письмо себе"
        ask: "Напишите пару строк себе — тому, кто откроет этот файл через месяц."
        height: 38

  - type: outro
    title: "Если откликнулось — напишите"
    text: "Эта тетрадь — небольшая часть программы «Ясность». Если после неё стало понятнее, но хочется довести до результата, приходите: разберём вашу точку А лично."
    cta: "Записаться на разбор"
    cta_url: "https://example.com"
    contacts:
      - "telegram · @username"
      - "почта · hello@example.com"
      - "сайт · example.com"
